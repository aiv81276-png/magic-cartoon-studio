
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Cartoon Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101426;color:white;font-family:Arial,sans-serif}
h1{text-align:center;color:#ffcf5a}
p{text-align:center;color:#ccd2e5}
.card{background:#202944;padding:18px;border-radius:16px;margin:18px 0}
label{display:block;margin:14px 0 7px}
input,select,button{width:100%;padding:13px;border:0;border-radius:9px;font-size:16px}
input,select{background:white;color:#171717}
button{background:#ffbd45;font-weight:bold;margin-top:16px}
#result{white-space:pre-wrap;line-height:1.6;margin-top:18px}
.small{font-size:13px;color:#b9c3dc}
</style>
</head>
<body>
<h1>🎬 Magic Cartoon Studio</h1>
<p>Apni Hindi cartoon duniya banao!</p>

<div class="card">
<label>Story ka naam</label>
<input id="name" value="Arif aur Rahasyamayi Qila">

<label>Video ki length</label>
<select id="length">
<option>30 second</option>
<option>1 minute</option>
<option>3 minute</option>
<option selected>5 minute</option>
<option>10 minute</option>
<option>15 minute</option>
<option>30 minute</option>
</select>

<label>Video format</label>
<select id="format">
<option>YouTube Shorts (9:16)</option>
<option selected>Long Video (16:9)</option>
</select>

<label>Story type</label>
<select id="genre">
<option>Adventure</option>
<option>Comedy</option>
<option>Moral Story</option>
<option>Animal Story</option>
<option>Fantasy</option>
<option>Friendship</option>
</select>

<label>Language</label>
<select id="language">
<option>Hindi</option>
<option>Hinglish</option>
</select>

<button onclick="createStory()">✨ Story aur Scene Prompts Banao</button>
<div id="result"></div>
<button onclick="copyStory()">📋 Story Copy Karo</button>
</div>

<p class="small">Abhi story planner demo hai. AI images, Hindi voice aur MP4 generation abhi connect nahi hain.</p>

<script>
let finalStory="";

function createStory(){
const name=document.getElementById("name").value.trim();
if(!name){alert("Story ka naam likho");return;}

const length=document.getElementById("length").value;
const format=document.getElementById("format").value;
const genre=document.getElementById("genre").value;
const language=document.getElementById("language").value;

const count=length==="30 second"?3:
length==="1 minute"?4:
length==="3 minute"?6:
length==="5 minute"?22:
length==="10 minute"?12:
length==="15 minute"?16:20;

let scenes="";
for(let i=1;i<=count;i++){
scenes+="SCENE "+i+"\n";
scenes+=i===1?
"Opening: Arif discovers a mysterious old fort. Wide cinematic shot.":
i===count?
"Final: Arif solves the mystery and returns home safely.":
"Arif explores the mysterious fort, discovers clues and faces a new adventure.";
scenes+="\nCharacter consistency: Arif ka same face, same clothes aur same 3D cartoon appearance.\n\n";
}

finalStory=
"🎬 "+name+"\n"+
"Length: "+length+"\nFormat: "+format+
"\nGenre: "+genre+"\nLanguage: "+language+
"\n\nCHARACTER: Arif, consistent 3D cartoon appearance.\n\n"+
"STORY:\nArif ek rahasyamayi qile ke paas pahunchta hai. Qile ke andar use purane raaz, ajeeb awaazein aur mushkil paheliyan milti hain. Apni himmat aur samajhdari se Arif qile ka raaz suljhata hai aur ek nayi seekh lekar ghar laut ta hai.\n\n"+
"SCENE BY SCENE PROMPTS:\n\n"+scenes+
"VOICEOVER: Natural expressive Hindi narration.\n"+
"MUSIC: Original cartoon background music.\n"+
"SUBTITLES: Hindi subtitles.\n";

document.getElementById("result").textContent=finalStory;
}

function copyStory(){
if(!finalStory){alert("Pehle story banao");return;}
if(navigator.clipboard){
navigator.clipboard.writeText(finalStory)
.then(()=>alert("Story copy ho gayi!"))
.catch(()=>alert("Story ko long press karke copy karo."));
}else{
alert("Story ko long press karke copy karo.");
}
}
</script>
</body>
</html>
